<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reflex — Live Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

<header class="bg-slate-900 text-white px-6 py-3 flex items-center justify-between sticky top-0 z-10">
  <h1 class="text-xl font-bold">⚡ Reflex <span class="text-slate-400 font-normal text-sm">— retailer · dispatcher · riders · SMS, one live page</span></h1>
  <div class="flex items-center gap-2 text-sm">
    <span id="ws-dot" class="w-3 h-3 rounded-full bg-red-500"></span><span id="ws-label">connecting…</span>
  </div>
</header>

<!-- 5 Columns on XL screens: Retailer, Dispatcher, Rider1, Rider2, Phone/Traffic -->
<main class="p-4 grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-5 gap-4 items-start">

  <!-- ============ RETAILER ============ -->
  <section class="bg-white rounded-xl shadow p-4 space-y-3">
    <h2 class="font-bold text-lg">🛍️ Retailer</h2>
    <form id="new-delivery-form" class="grid gap-2 text-sm">
      <input name="customer_name"  placeholder="Customer name"  class="border rounded-lg px-3 py-2">
      <input name="customer_phone" placeholder="Customer phone" class="border rounded-lg px-3 py-2">
      <input name="delivery_address" placeholder="Delivery address" class="border rounded-lg px-3 py-2">
      <input name="item_description" placeholder="Item description" class="border rounded-lg px-3 py-2">
      <button class="bg-indigo-600 text-white rounded-lg py-2 font-semibold hover:bg-indigo-700">+ Create delivery</button>
    </form>
    <h3 class="text-xs font-bold text-slate-500 uppercase">My deliveries (live)</h3>
    <div id="retailer-list" class="space-y-3 overflow-y-auto max-h-[55vh] pr-1"></div>
  </section>

  <!-- ============ DISPATCHER ============ -->
  <section class="bg-white rounded-xl shadow p-4 space-y-3">
    <h2 class="font-bold text-lg">🎛️ Dispatcher</h2>
    <h3 class="text-xs font-bold text-slate-500 uppercase">Pending queue (real-time)</h3>
    <div id="pending-list" class="space-y-2"></div>
    <h3 class="text-xs font-bold text-slate-500 uppercase">Board</h3>
    <div id="board-list"></div>
    <h3 class="text-xs font-bold text-slate-500 uppercase mt-2">Audit log (StatusEvents)</h3>
    <div id="audit-list"></div>
  </section>

  <!-- ============ RIDERS ============ -->
  <section class="bg-white rounded-xl shadow p-4"><h2 class="font-bold text-lg mb-2">🏍️ Rider 1</h2><div id="list-rider1" class="space-y-2 max-h-[70vh] overflow-y-auto"></div></section>
  <section class="bg-white rounded-xl shadow p-4"><h2 class="font-bold text-lg mb-2">🏍️ Rider 2</h2><div id="list-rider2" class="space-y-2 max-h-[70vh] overflow-y-auto"></div></section>

  <!-- ============ CUSTOMER PHONE + WS TRAFFIC (Now in 5th column) ============ -->
  <section class="space-y-4">
    <div class="bg-slate-900 rounded-[2rem] p-3 shadow-xl">
      <div id="sms-screen" class="bg-slate-800 rounded-2xl p-3 h-[430px] overflow-y-auto flex flex-col gap-2">
        <div class="text-center text-xs text-slate-400 font-semibold pb-1">📱 Customer phone — SMS inbox</div>
        <div id="sms-list" class="flex flex-col gap-2"></div>
      </div>
    </div>
    <div class="bg-white rounded-xl shadow p-3">
      <h3 class="text-xs font-bold text-slate-500 uppercase mb-1">WebSocket traffic</h3>
      <div id="traffic-list"></div>
    </div>
  </section>
</main>

<script>
const state = { deliveries: [], sms: [] };
// UPDATED: Removed rider3 from the array so the JS doesn't crash looking for the removed HTML column
const RIDERS = ["rider1", "rider2"]; 
const COLORS = {PENDING:"bg-amber-100 text-amber-800", ASSIGNED:"bg-blue-100 text-blue-800",
  PICKED_UP:"bg-violet-100 text-violet-800", DELIVERED:"bg-green-100 text-green-800",
  FAILED:"bg-red-100 text-red-700", CANCELLED:"bg-slate-200 text-slate-600"};
const chip  = s => `<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold ${COLORS[s]||""}">${s.replace("_"," ")}</span>`;
const empty = t => `<p class="text-xs text-slate-400">${t}</p>`;

/* ---------- helpers ---------- */
function csrfToken(){ const m = document.cookie.match(/csrftoken=([^;]+)/); return m ? m[1] : ""; }
function post(url, data){
  const fd = new FormData();
  Object.entries(data).forEach(([k,v]) => fd.append(k,v));
  return fetch(url, {method:"POST", headers:{"X-CSRFToken": csrfToken()}, body:fd})
    .then(r => r.json()).then(j => { if(!j.ok) alert(j.error || "Error"); });
}

/* ---------- WebSocket with REST fallback on reconnect (from the design doc) ---------- */
let ws;
function connectWS(){
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/demo/");
  ws.onopen = () => {
    document.getElementById("ws-dot").className = "w-3 h-3 rounded-full bg-green-500";
    document.getElementById("ws-label").textContent = "live (WebSocket)";
    loadState();                                   // refetch truth on every (re)connect
  };
  ws.onclose = () => {
    document.getElementById("ws-dot").className = "w-3 h-3 rounded-full bg-red-500";
    document.getElementById("ws-label").textContent = "reconnecting…";
    setTimeout(connectWS, 1500);
  };
  ws.onmessage = e => handle(JSON.parse(e.data));
}
function loadState(){
  fetch("/api/state/").then(r => r.json()).then(s => {
    state.deliveries = s.deliveries; state.sms = s.sms; renderAll(); renderPhone();
  });
}

/* ---------- event handling ---------- */
function handle(msg){
  logTraffic(msg);
  if (msg.kind === "sms_queued"){ state.sms.push(msg.sms); renderPhone(); }
  else if (msg.kind === "sms_sent"){ const s = state.sms.find(x => x.id === msg.id); if (s) s.status = "sent"; renderPhone(); }
  else if (msg.delivery){
    const i = state.deliveries.findIndex(x => x.id === msg.delivery.id);
    if (i >= 0) state.deliveries[i] = msg.delivery; else state.deliveries.unshift(msg.delivery);
    renderAll();
  }
}
function logTraffic(msg){
  const el = document.getElementById("traffic-list");
  const line = document.createElement("div");
  line.className = "text-[10px] font-mono text-slate-500 truncate";
  line.textContent = "→ groups [" + msg.groups.join(", ") + "]  event: " + msg.kind;
  el.prepend(line);
  while (el.children.length > 8) el.removeChild(el.lastChild);
}

/* ---------- renderers ---------- */
function renderAll(){ renderRetailer(); renderDispatcher(); renderRiders(); renderAudit(); }

function renderRetailer(){
  const el = document.getElementById("retailer-list");
  el.innerHTML = state.deliveries.map(d => `
    <div class="border rounded-lg p-3 text-sm space-y-1">
      <div class="flex justify-between items-center"><b>${d.customer_name}</b>${chip(d.status)}</div>
      <div class="text-slate-500 text-xs">${d.item} → ${d.address}</div>
      <div class="flex items-center gap-2 pt-1">
        <div data-qr="${d.qr_token}" class="bg-white p-1 border rounded"></div>
        <div class="text-[10px] text-slate-400">QR token (printed for scan-on-delivery)<br><code>${d.qr_token.slice(0,13)}…</code></div>
      </div>
    </div>`).join("") || empty("No deliveries yet — create one above.");
  el.querySelectorAll("[data-qr]").forEach(div => new QRCode(div, {text: div.dataset.qr, width: 64, height: 64}));
}

function renderDispatcher(){
  const pending = state.deliveries.filter(d => d.status === "PENDING");
  document.getElementById("pending-list").innerHTML = pending.map(d => `
    <div class="flex items-center gap-2 border rounded-lg p-2 text-sm">
      <div class="flex-1"><b>${d.customer_name}</b><div class="text-xs text-slate-500">${d.address}</div></div>
      <select id="sel-${d.id}" class="border rounded px-2 py-1 text-sm">${RIDERS.map(r => `<option>${r}</option>`).join("")}</select>
      <button onclick="assign('${d.id}')" class="bg-blue-600 text-white text-sm px-3 py-1 rounded-lg hover:bg-blue-700">Assign</button>
    </div>`).join("") || empty("Queue clear 🎉");

  document.getElementById("board-list").innerHTML = state.deliveries.map(d => `
    <div class="flex items-center justify-between gap-2 text-sm py-1 border-b border-slate-100">
      <span class="truncate">${d.customer_name}</span>
      <span class="text-xs text-slate-400">${d.rider || "—"}</span>${chip(d.status)}
    </div>`).join("") || empty("Nothing on the board.");
}

function renderAudit(){
  const rows = state.deliveries.flatMap(d => d.events.map(e => Object.assign({}, e)))
    .sort((a,b) => a.ts < b.ts ? 1 : -1).slice(0, 12);
  document.getElementById("audit-list").innerHTML = rows.map(e => `
    <div class="text-[11px] py-0.5 border-b border-slate-100 font-mono">
      ${e.time} · ${e.actor} · ${e.from || "∅"}→${e.to} ${e.photo ? "📷" : ""}${e.to === "DELIVERED" ? (e.scan ? "✅scan" : "⚠️scan-mismatch") : ""}
    </div>`).join("") || empty("No events yet.");
}

function renderRiders(){
  RIDERS.forEach(r => {
    const mine = state.deliveries.filter(d => d.rider === r);
    document.getElementById("list-" + r).innerHTML = mine.map(d => {
      if (d.status === "ASSIGNED") return `
        <div class="border rounded-lg p-2 text-sm space-y-2">
          <div class="flex justify-between"><b>${d.customer_name}</b>${chip(d.status)}</div>
          <div class="text-xs text-slate-500">${d.address}</div>
          <button onclick="advance('${d.id}','${r}','PICKED_UP')" class="w-full bg-violet-600 text-white rounded-lg py-1.5 text-sm hover:bg-violet-700">📦 Mark PICKED UP</button>
        </div>`;
      if (d.status === "PICKED_UP") return `
        <div class="border rounded-lg p-2 text-sm space-y-2">
          <div class="flex justify-between"><b>${d.customer_name}</b>${chip(d.status)}</div>
          <label class="flex items-center gap-2 text-xs"><input id="photo-${d.id}" type="checkbox" checked class="accent-green-600"> 📸 Photo proof taken</label>
          <input id="scan-${d.id}" placeholder="scan QR token…" class="w-full border rounded px-2 py-1 text-xs">
          <div class="flex gap-1 text-[11px]">
            <button onclick="fillScan('${d.id}','${d.qr_token}')" class="bg-slate-200 rounded px-2 py-1 hover:bg-slate-300">✅ scan correct</button>
            <button onclick="fillScan('${d.id}','wrong-code')" class="bg-slate-200 rounded px-2 py-1 hover:bg-slate-300">⚠️ scan wrong</button>
          </div>
          <button onclick="advance('${d.id}','${r}','DELIVERED')" class="w-full bg-green-600 text-white rounded-lg py-1.5 text-sm hover:bg-green-700">✅ Mark DELIVERED</button>
        </div>`;
      return `<div class="border rounded-lg p-2 text-sm flex justify-between"><b>${d.customer_name}</b>${chip(d.status)}</div>`;
    }).join("") || empty("No deliveries assigned.");
  });
}

function renderPhone(){
  const screen = document.getElementById("sms-screen");
  // UPDATED: Reverse the array so the newest messages render at the top
  const reversedSms = [...state.sms].reverse();
  
  document.getElementById("sms-list").innerHTML = reversedSms.map(s => `
    <div class="bg-slate-700 rounded-2xl rounded-tl-none p-2 text-xs text-white max-w-[92%]">
      <div class="text-[10px] text-slate-400">SMS to ${s.phone}</div>
      ${s.payload}
      <div class="text-right text-[10px] ${s.status === "sent" ? "text-green-400" : "text-amber-300"}">
        ${s.status === "sent" ? "✓✓ delivered" : "⏳ queued (outbox)…"}
      </div>
    </div>`).join("") || `<p class="text-xs text-slate-500 text-center py-8">Customer SMS messages<br>appear here at PICKED UP<br>and DELIVERED.</p>`;
    
  // UPDATED: Scroll to the top (0) so the newest message is immediately visible
  screen.scrollTop = 0;
}

/* ---------- actions ---------- */
function assign(id){ post("/api/assign/", {delivery_id: id, rider: document.getElementById("sel-" + id).value}); }
function fillScan(id, token){ document.getElementById("scan-" + id).value = token; }
function advance(id, rider, action){
  const data = {delivery_id: id, rider: rider, action: action};
  if (action === "DELIVERED"){
    data.photo = document.getElementById("photo-" + id).checked ? "1" : "0";
    data.scan_token = document.getElementById("scan-" + id).value;
  }
  post("/api/advance/", data);
}
document.getElementById("new-delivery-form").addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  post("/api/create/", {customer_name: f.customer_name.value, customer_phone: f.customer_phone.value,
                        delivery_address: f.delivery_address.value, item_description: f.item_description.value});
  f.reset();
});

connectWS();
</script>
</body>
</html>
